<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Support</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0a0a0a;
color:white;
text-align:center;
}

/* garis finish */
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0a0a0a;
color:white;
text-align:center;
height:100vh;
overflow:hidden;
}

.container{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
position:relative;
z-index:2;
}

.avatar{
width: 200px;
margin-bottom:20px;
}

.car{
position:fixed;
top:-150px;
left:50%;
transform:translateX(-50%);
width:1800px;
opacity:0.15;
pointer-events:none;
z-index:0;
}

h1{
color:#ff2b2b;
text-shadow:0 0 10px #ff0000;
letter-spacing:3px;
}

/* tombol neon */

.btn{
display:block;
width:250px;
margin:20px auto;
padding:15px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
font-size:16px;
letter-spacing:1px;
border:2px solid;
transition:0.3s;
}

/* neon saweria */

.saweria{
color:#00ffff;
border-color:#00ffff;
box-shadow:
0 0 5px #00ffff,
0 0 15px #00ffff inset;
}

.saweria:hover{
background:#00ffff;
color:#000;
box-shadow:
0 0 10px #00ffff,
0 0 30px #00ffff,
0 0 60px #00ffff;
}

/* neon discord */

.discord{
color:#ff00ff;
border-color:#ff00ff;
box-shadow:
0 0 5px #ff00ff,
0 0 15px #ff00ff inset;
}

.discord:hover{
background:#ff00ff;
color:#000;
box-shadow:
0 0 10px #ff00ff,
0 0 30px #ff00ff,
0 0 60px #ff00ff;
}

/* garis jalan animasi */

.road{
position:fixed;
bottom:0;
left:0;
width:100%;
height:6px;
background:repeating-linear-gradient(
90deg,
transparent,
transparent 25px,
white 25px,
white 50px
);
animation:road 2s linear infinite;
opacity:0.4;
}

@keyframes road{
from{background-position:0;}
to{background-position:100px;}
}

footer{
margin-top:60px;
color:#666;
font-size:12px;
}

</style>
</head>

<body>

<div class="container">

<img src="image/logo.png" class="avatar">
<img src="image/car.png" class="car">

<h1>STREET RACING</h1>
<p>Support the engine 🔥</p>

<a href="https://saweria.co/Linnn22" class="btn saweria" target="_blank">
💰 SAWERIA DONATION
</a>

<a href="https://discord.gg/za6GDm7R" class="btn discord" target="_blank">
💬 JOIN DISCORD
</a>

<footer>
🏁 Speed Community
</footer>

</div>

<div class="road"></div>

</body>
</html>
